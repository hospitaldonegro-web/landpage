
media:
  - name: jornais
    label: Arquivos dos jornais
    input: jornais
    output: /jornais
    extensions:
      - pdf

content:
  # DADOS DO INSTITUTO
  - name: configuracoes
    label: Dados do instituto
    type: file
    path: data/dados.json
    format: json

    fields:
      - name: instagram
        label: Link do Instagram
        type: string

      - name: youtube
        label: Link do YouTube
        type: string

      - name: facebook
        label: Link do Facebook
        type: string

      - name: whatsapp
        label: Link do WhatsApp (https://wa.me/número)
        type: string

      - name: email
        label: E-mail
        type: string

      - name: telefone
        label: Telefone (formato 4591111-1111)
        type: string

      - name: localizacao
        label: Localização
        type: string

  # JORNAIS PUBLICADOS
  - name: jornais
    label: Jornais publicados
    type: file
    path: data/jornais.json
    format: json
    list: true

    fields:
      - name: numero
        label: Número da edição (Formato 01)
        type: string
        required: true

      - name: edicaoFormatada
        label: Edição formatada (Formato EDIÇÃO 01)
        type: string
        required: true

      - name: mesAno
        label: Mês e ano (Formato mês/ano)
        type: string
        required: true

      - name: titulo
        label: Título
        type: string
        required: true

      - name: descricao
        label: Descrição
        type: string
        required: true

      - name: paginas
        label: Quantidade de páginas (Formato 01 Páginas)
        type: string
        required: true

      - name: pdf
        label: Arquivo PDF
        type: file
        options:
          media: jornais
          extensions:
            - pdf
        required: true
